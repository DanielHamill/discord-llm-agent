apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: discord-llm-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  namespace: discord-llm-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-server
  template:
    metadata:
      labels:
        app: model-server
    spec:
      runtimeClassName: nvidia
      containers:
      - name: ollama
        image: ollama/ollama
        command: ["ollama", "serve"]
        ports:
        - containerPort: 11434
        securityContext:
          privileged: true
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        resources:
          requests:
            memory: "4Gi"
            cpu: "1"
            nvidia.com/gpu: "1"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  name: model-server
  namespace: discord-llm-agent
spec:
  type: NodePort
  selector:
    app: model-server
  ports:
  - port: 11434
    targetPort: 11434
    nodePort: 31434
