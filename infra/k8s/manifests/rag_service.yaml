apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: discord-llm-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      containers:
      - name: rag-service
        image: danielhamill/rag-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: OLLAMA_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: rag-service-config
              key: OLLAMA_BASE_URL
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: rag-service-config
              key: MODEL_NAME
        - name: MODEL_SERVER_UNAVAILABLE_MSG
          valueFrom:
            configMapKeyRef:
              name: rag-service-config
              key: MODEL_SERVER_UNAVAILABLE_MSG
        - name: PINECONE_API_KEY
          valueFrom:
            secretKeyRef:
              name: parking-deck-secrets
              key: PINECONE_API_KEY
        imagePullPolicy: Always
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: discord-llm-agent
spec:
  type: NodePort
  selector:
    app: rag-service
  ports:
  - port: 8000
    targetPort: 8000
    name: http

