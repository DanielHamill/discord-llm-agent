apiVersion: v1
kind: Namespace
metadata:
  name: app-namespace

---
# Message Broker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-broker
  namespace: app-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message-broker
  template:
    metadata:
      labels:
        app: message-broker
    spec:
      containers:
      - name: broker
        image: broker-image:latest
        ports:
        - containerPort: 5672
          name: broker-port
        env:
        - name: BROKER_PORT
          value: "5672"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
# Internal Service for Message Broker (cluster communication)
apiVersion: v1
kind: Service
metadata:
  name: message-broker-internal
  namespace: app-namespace
spec:
  type: ClusterIP
  selector:
    app: message-broker
  ports:
  - port: 5672
    targetPort: 5672
    name: broker-port

---
# Public-Facing Service for Message Broker
apiVersion: v1
kind: Service
metadata:
  name: message-broker-public
  namespace: app-namespace
spec:
  type: LoadBalancer
  selector:
    app: message-broker
  ports:
  - port: 5672
    targetPort: 5672
    name: broker-port

---
# Microservice Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher-microservice
  namespace: app-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: publisher-microservice
  template:
    metadata:
      labels:
        app: publisher-microservice
    spec:
      containers:
      - name: publisher
        image: publisher-image:latest
        ports:
        - containerPort: 8080
        env:
        - name: BROKER_HOST
          value: "message-broker-internal.app-namespace.svc.cluster.local"
        - name: BROKER_PORT
          value: "5672"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
# Internal Service for Microservice
apiVersion: v1
kind: Service
metadata:
  name: publisher-microservice
  namespace: app-namespace
spec:
  type: ClusterIP
  selector:
    app: publisher-microservice
  ports:
  - port: 8080
    targetPort: 8080
