name: Publish rag-service

on:
  push:
    branches:
      - main
    paths:
      - "rag-service/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version bumped
        id: version_check
        if: github.event_name != 'workflow_dispatch'
        run: |
          PREV=$(git show HEAD~1:rag-service/pyproject.toml 2>/dev/null | grep '^version = ' | cut -d'"' -f2 || echo "none")
          CURR=$(grep '^version = ' rag-service/pyproject.toml | cut -d'"' -f2)
          if [ "$PREV" = "$CURR" ]; then
            echo "Version unchanged ($CURR), skipping build."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Version changed: $PREV -> $CURR"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Extract version from pyproject.toml
        id: version
        if: github.event_name == 'workflow_dispatch' || steps.version_check.outputs.changed == 'true'
        run: |
          VERSION=$(grep '^version = ' rag-service/pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || steps.version_check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' || steps.version_check.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: github.event_name == 'workflow_dispatch' || steps.version_check.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: rag-service/
          file: rag-service/dockerfile
          push: true
          tags: |
            danielhamill/rag-service:${{ steps.version.outputs.version }}
            danielhamill/rag-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
